name: Analysis PR candidate validation
on:
  push:
    branches: [codex/analysis-pr-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CXX: clang++
      LAUNCHLAB_M5GFX: ${{ runner.temp }}/M5GFX
      LAUNCHLAB_UI_RENDER_BUILD: ${{ runner.temp }}/ui-render
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ea77aa77e7cae7a4db10e74cda1780927dd5b280
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Toolchain
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libsdl2-dev
          bash firmware/tools/ui_render/fetch_m5gfx.sh "$LAUNCHLAB_M5GFX"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: firmware/build-host-suite/cc-cache
          key: analysis-validation-${{ runner.os }}-${{ github.sha }}
          restore-keys: analysis-validation-${{ runner.os }}-
      - name: Host sanitizer proof
        run: python3 scripts/firmware_proof.py host -j 4 2>&1 | tee "$RUNNER_TEMP/host-proof.log"
      - name: Published artifacts and site
        if: always()
        run: |
          python3 scripts/verify-artifacts.py
          npm test --prefix site
          npm run build --prefix site
      - name: Render intended menu and Device changes for review
        if: always()
        run: |
          python3 firmware/tests/check_ui_render.py --update
          git diff -- firmware/tests/fixtures/ui_render*.txt > "$RUNNER_TEMP/ui-fixtures.patch"
          mkdir -p "$RUNNER_TEMP/all-frames" "$RUNNER_TEMP/review-frames"
          "$LAUNCHLAB_UI_RENDER_BUILD/ui_render" --out "$RUNNER_TEMP/all-frames" > /dev/null
          for screen in menu menu-charging battery battery-low main main-charging; do
            cp "$RUNNER_TEMP/all-frames/theme0-$screen.ppm" "$RUNNER_TEMP/review-frames/"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-validation
          path: |
            launchlab-proof.json
            ${{ runner.temp }}/host-proof.log
            ${{ runner.temp }}/ui-fixtures.patch
            ${{ runner.temp }}/review-frames
